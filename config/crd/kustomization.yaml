resources:
- bases/infrastructure.cluster.x-k8s.io_ovhclusters.yaml
- bases/infrastructure.cluster.x-k8s.io_ovhclustertemplates.yaml
- bases/infrastructure.cluster.x-k8s.io_ovhmachines.yaml
- bases/infrastructure.cluster.x-k8s.io_ovhmachinetemplates.yaml
# NOTE: bases/...ovhmachinepools.yaml is intentionally omitted. OVHMachinePool
# has a single v1alpha2 version and no conversion webhook (no controller yet),
# so it lacks the spec.conversion + cert-manager annotations that config/default's
# replacements inject into every CRD — adding it makes `kustomize build
# config/default` fail. Re-add it together with the MachinePool controller+webhook.
# (The Helm chart currently over-ships this CRD; reconcile separately.)

patches:
- path: patches/webhook_in_ovhclusters.yaml
- path: patches/webhook_in_ovhclustertemplates.yaml
- path: patches/webhook_in_ovhmachines.yaml
- path: patches/webhook_in_ovhmachinetemplates.yaml

# CAPI contract version label: declares which CRD versions implement the CAPI v1beta2 contract.
# Without this label, the CAPI Cluster controller cannot resolve the InfraCluster reference
# and reports "cannot find any versions matching contract cluster.x-k8s.io/v1beta2".
labels:
- pairs:
    cluster.x-k8s.io/v1beta2: v1alpha2
  includeSelectors: false
  fields:
  - path: metadata/labels
    create: true
