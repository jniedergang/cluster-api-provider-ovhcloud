                    minimum: 0
                    type: integer
                required:
                - subnetCIDR
                type: object
              region:
                description: Region is the OVH Cloud region (e.g. "GRA7", "SBG5",
                  "BHS5").
                type: string
              securityGroups:
                description: SecurityGroups defines security groups to create and
                  apply to cluster instances.
                items:
                  description: OVHSecurityGroup defines a security group to create
                    and apply to cluster instances.
                  properties:
                    name:
                      description: Name is the security group name.
                      type: string
                    rules:
                      description: Rules is the list of security group rules.
                      items:
                        description: OVHSecurityRule defines a single firewall rule
                          in a security group.
                        properties:
                          direction:
                            description: Direction is "ingress" or "egress".
                            enum:
                            - ingress
                            - egress
                            type: string
                          etherType:
                            default: IPv4
                            description: EtherType is "IPv4" or "IPv6".
                            type: string
                          portRangeMax:
                            description: PortRangeMax is the end of the port range.
                            format: int32
                            type: integer
                          portRangeMin:
                            description: PortRangeMin is the start of the port range.
                            format: int32
                            type: integer
                          protocol:
                            description: Protocol is tcp, udp, icmp, or empty for
                              any.
                            type: string
                          remoteIPPrefix:
                            description: RemoteIPPrefix is the CIDR for allowed source/dest
                              (e.g. "0.0.0.0/0").
                            type: string
                        required:
                        - direction
                        type: object
                      type: array
                  required:
                  - name
                  type: object
                type: array
              serviceName:
                description: ServiceName is the OVH Public Cloud project ID.
                type: string
              sshKeyName:
                description: SSHKeyName is the name of the SSH key registered in OVH
