                  type: object
                type: array
              dnsRecordID:
                description: DNSRecordID is the ID of the DNS A record created for
                  the control plane endpoint.
                format: int64
                type: integer
              failureDomains:
                description: FailureDomains reports the availability zones discovered
                  in the region.
                items:
                  description: |-
                    FailureDomain is the Schema for Cluster API failure domains.
                    It allows controllers to understand how many failure domains a cluster can optionally span across.
                  properties:
                    attributes:
                      additionalProperties:
                        type: string
                      description: attributes is a free form map of attributes an
                        infrastructure provider might use or require.
                      type: object
                    controlPlane:
                      description: controlPlane determines if this failure domain
                        is suitable for use by control plane machines.
                      type: boolean
                    name:
                      description: name is the name of the failure domain.
                      maxLength: 256
                      minLength: 1
                      type: string
                  required:
                  - name
                  type: object
                type: array
              failureMessage:
                description: FailureMessage is a full error message dump of the above
                  failureReason.
                type: string
              failureReason:
                description: FailureReason is the short name for the reason why a
                  failure might be happening.
                type: string
              floatingIPID:
                description: FloatingIPID is the floating IP assigned to the load
                  balancer.
                type: string
              gatewayExposed:
