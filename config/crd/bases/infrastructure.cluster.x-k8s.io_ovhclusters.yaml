                  ttl:
                    default: 300
                    description: TTL is the DNS record TTL in seconds.
                    type: integer
                  zoneName:
                    description: ZoneName is the OVH DNS zone (e.g. "example.com").
                    type: string
                required:
                - zoneName
                type: object
              failureDomains:
                description: |-
                  FailureDomains is a list of availability zones to use.
                  If empty, the controller auto-discovers zones from the OVH API.
                items:
                  type: string
                type: array
              identitySecret:
                description: |-
                  IdentitySecret references the Secret containing OVH API credentials.
                  The Secret must contain keys: endpoint, applicationKey, applicationSecret, consumerKey.
                properties:
                  name:
                    description: Name is the name of the Secret.
                    type: string
                  namespace:
                    description: Namespace is the namespace of the Secret.
                    type: string
                required:
                - name
                - namespace
                type: object
              loadBalancerConfig:
                description: LoadBalancerConfig describes how the OVH managed load
